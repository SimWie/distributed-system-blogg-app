# --- CORS -------------------------------------------------------------------
# Browser dürfen nur von den hier erlaubten Origins auf das API zugreifen.
# Default: Angular-Dev-Server (ng serve). Für andere Umgebungen (z. B. Cloud
# Deployment) kann die Liste über die Umgebungsvariable CORS_ALLOWED_ORIGINS
# überschrieben werden (kommagetrennt, z. B. "https://blog.example.com").
# Bewusst KEIN Wildcard "*": das API ist noch ungeschützt und soll nicht von
# beliebigen Webseiten aus ansprechbar sein.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization
quarkus.http.cors.access-control-max-age=1H

# Client-ID und Secret (Optional für Dev Services)
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret

# Eigene Benutzer und Rollenzuweisungen im Dev Service definieren
# Realm "blog" mit Rollen user/admin, Client backend-service und den Benutzern
# alice (admin, user) und bob (user). Die Datei setzt sslRequired=none, sonst
# lehnt Keycloak HTTP-Anfragen über das Docker-Gateway mit "HTTPS required" ab.
%dev,test.quarkus.keycloak.devservices.realm-path=blog-realm.json

# Port und Realm des Dev-Services festlegen (Optional)
%dev.quarkus.keycloak.devservices.port=8088
# Default sind 4s. Startet Keycloak gleichzeitig mit MySQL, reicht das oft nicht
# und der Realm wird nicht angelegt ("Admin token can not be acquired").
quarkus.keycloak.devservices.web-client-timeout=30S
# Keycloak verlangt im master-Realm HTTPS für Anfragen, die es nicht als lokal
# erkennt (z. B. über das Docker-Desktop-Gateway). Dann scheitert der Admin-Login
# mit "HTTPS required" und der Realm "blog" wird nicht angelegt. Nur für lokal.
quarkus.keycloak.devservices.disable-https=true
quarkus.keycloak.devservices.realm-name=blog
# --- Swagger UI -------------------------------------------------------------
# Fügt in der OpenAPI-Beschreibung ein Bearer-Token-Schema hinzu. Swagger UI
# zeigt damit einen "Authorize"-Button, über den man ein Access-Token einfügt.
quarkus.smallrye-openapi.security-scheme=jwt
